name: Daily Order Alert

on:
  schedule:
    - cron: '0 6 * * *'  # 9:00 Moscow (UTC+3)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up server
        run: curl -s --max-time 60 https://rbm-coody-stock.onrender.com/ > /dev/null || true

      - name: Wait for server to be ready
        run: sleep 30

      - name: Send order notification
        run: |
          curl -f --max-time 120 \
            -X POST https://rbm-coody-stock.onrender.com/api/notify \
            -H "Content-Type: application/json" \
            -d '{"token":"${{ secrets.TELEGRAM_TOKEN }}","chat_id":"${{ secrets.TELEGRAM_CHAT_ID }}"}'
