name: Daily Order Alert

on:
  schedule:
    - cron: '0 6 * * *'  # 9:00 Moscow (UTC+3)
  workflow_dispatch:      # Manual trigger for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger order notification
        run: |
          curl -f "https://rbm-coody-stock.onrender.com/api/notify?token=${{ secrets.TELEGRAM_TOKEN }}&chat_id=${{ secrets.TELEGRAM_CHAT_ID }}"
